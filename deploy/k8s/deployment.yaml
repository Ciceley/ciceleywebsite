apiVersion: apps/v1
kind: Deployment
metadata:
  name: ciceley-site
  namespace: apps
  labels:
    app: ciceley-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ciceley-site
  template:
    metadata:
      labels:
        app: ciceley-site
    spec:
      containers:
        - name: ciceley-site
          # Tag is bumped automatically by .github/workflows/deploy.yml.
          # The GHCR package must be public (or add an imagePullSecrets entry).
          image: ghcr.io/ciceley/ciceleywebsite:main-20261012-015032-8b46b4f
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 1
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "96Mi"
              cpu: "200m"
