apiVersion: apps/v1
kind: Deployment
metadata:
  name: ciceley-site
  namespace: apps
  labels:
    app: ciceley-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ciceley-site
  template:
    metadata:
      labels:
        app: ciceley-site
    spec:
      # Two replicas are only HA if they sit on two nodes. Both landed on sitaw-amd,
      # so losing that node took the whole service down until the scheduler found room.
      # Soft (ScheduleAnyway), so a single-node cluster can still run the workload.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ciceley-site
      containers:
        - name: ciceley-site
          # Tag is bumped automatically by .github/workflows/deploy.yml.
          # The GHCR package must be public (or add an imagePullSecrets entry).
          image: ghcr.io/ciceley/ciceleywebsite:main-20261012-233711-ea96aad
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 1
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "96Mi"
              cpu: "200m"
