apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ciceley-site
  namespace: apps
spec:
  ingressClassName: nginx
  rules:
    - host: ciceley.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ciceley-site
                port:
                  number: 80
    - host: www.ciceley.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ciceley-site
                port:
                  number: 80
