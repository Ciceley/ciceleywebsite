name: Manifests

# build.yml builds the site on every PR but never looks at deploy/k8s/, so a manifest change
# went out unvalidated. Found 2026-11-04 in homelab-context (backlog ticket
# `app-repos-no-ci-for-manifests`) when the same PDB PR was checked in some app repos and
# not others.
#
# Static only: no cluster credentials, no deploy, nothing applied.

on:
  pull_request:
    paths:
      - "deploy/k8s/**"
      - ".github/workflows/manifests.yml"
  workflow_dispatch: {}

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize and kubeconform
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kustomize
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform

      # Rendering catches a kustomization that names a file nobody committed — the failure
      # that makes ArgoCD mark the whole Application Unknown rather than just this object.
      - name: The kustomization renders
        run: kustomize build deploy/k8s > /tmp/rendered.yaml

      # -strict rejects unknown fields, so a typo in `minAvailable` or a wrong apiVersion is
      # caught here instead of by a Degraded Application. `policy/v1beta1` (removed in 1.25)
      # is the specific mistake this estate has hit.
      - name: The rendered objects are valid
        run: kubeconform -strict -ignore-missing-schemas -summary /tmp/rendered.yaml

      # Cheap sanity that the render is not empty: an empty glob or a kustomization that
      # silently lists nothing would pass both steps above. Two silent failures in this
      # estate came from exactly that — a validation that validated zero objects.
      - name: The render is not empty
        run: |
          set -euo pipefail
          count=$(grep -c '^kind:' /tmp/rendered.yaml || true)
          echo "rendered $count object(s)"
          test "$count" -ge 3   # deployment + service + ingress at minimum
